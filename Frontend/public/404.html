<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الصفحة غير موجودة — خشبي | WOODEN</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/images/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --cream: #f3eee6; --ink: #221510; --walnut: #6b4a32; --walnut-deep: #3a2214; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: var(--cream); color: var(--ink);
        font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; line-height: 1.7;
        padding: 24px;
      }
      main { text-align: center; max-width: 640px; }
      .num {
        font-family: "Alexandria", sans-serif; font-weight: 800; font-size: clamp(7rem, 30vw, 16rem); line-height: 1.1;
        background-image: url("/textures/wood-light.svg"); background-size: 900px 675px;
        -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
        letter-spacing: -0.02em; direction: ltr;
      }
      h1 { font-family: "Alexandria", sans-serif; font-weight: 700; font-size: clamp(1.4rem, 4vw, 2rem); margin: 8px 0 12px; }
      p { margin: 0 0 28px; color: rgba(34, 21, 16, 0.7); }
      a.btn {
        display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px; border-radius: 6px;
        background: var(--walnut-deep); color: var(--cream); text-decoration: none; font-weight: 500;
      }
      a.btn:hover { background: var(--walnut); }
      .logo { height: 40px; width: auto; margin-bottom: 24px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/images/logo-mark.png" alt="" />
      <div class="num">404</div>
      <h1>هذه الصفحة غير موجودة</h1>
      <p>ربما تغيّر الرابط أو حُذفت الصفحة. عُد إلى الصفحة الرئيسية.</p>
      <a class="btn" href="/">الصفحة الرئيسية <span aria-hidden>←</span></a>
    </main>
  </body>
</html>
